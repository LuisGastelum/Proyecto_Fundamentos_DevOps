<!DOCTYPE html>
<html>
<head>
    <title>CloudOps Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">
    <h1 class="text-3xl font-bold mb-5">Panel de Control AWS</h1>
    
    <div class="bg-slate-800 p-6 rounded-lg shadow-xl border border-slate-700">
        <p class="mb-4">Presiona el botón para desplegar infraestructura:</p>
        
        <button onclick="desplegarEC2()" 
                class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold transition">
            Lanzar Instancia EC2
        </button>

        <div id="terminal" class="mt-6 p-4 bg-black font-mono text-green-400 rounded border border-slate-600 h-32 overflow-y-auto">
            > Esperando órdenes...
        </div>
    </div>

    <script>
        async function desplegarEC2() {
            const terminal = document.getElementById('terminal');
            terminal.innerHTML += "<br>> Iniciando despliegue en AWS...";
            
            try {
                const response = await fetch('/crear-ec2', { method: 'POST' });
                const data = await response.json();
                
                if(data.status === "success") {
                    terminal.innerHTML += `<br>> <span class="text-white">${data.message}</span>`;
                } else {
                    terminal.innerHTML += `<br>> <span class="text-red-500">Error: ${data.message}</span>`;
                }
            } catch (err) {
                terminal.innerHTML += `<br>> <span class="text-red-500">Error de conexión</span>`;
            }
        }
    </script>
</body>
</html>
