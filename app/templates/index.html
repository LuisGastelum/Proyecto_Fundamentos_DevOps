<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1c2c; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #25283d; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 80%; max-width: 800px; }
        h1 { border-bottom: 2px solid #4e54c8; padding-bottom: 10px; margin-bottom: 20px; }
        .botones { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { background-color: #4e54c8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #6c63ff; transform: translateY(-2px); }
        .terminal { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 6px; height: 200px; overflow-y: auto; border: 1px solid #333; line-height: 1.5; }
        .error { color: #ff5555; }
        .success { color: #55ff55; }
        .info { color: #55ffff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Control AWS</h1>
        <p>Selecciona una acción para desplegar infraestructura o registrar eventos:</p>
        
        <div class="botones">
            <button onclick="ejecutar('/lanzar_ec2')">Lanzar Instancia EC2</button>
            <button onclick="ejecutar('/respaldar_s3')">Respaldo S3</button>
            <button onclick="ejecutar('/registrar_log')">Log DynamoDB</button>
        </div>

        <div class="terminal" id="terminal">
            > Esperando órdenes...
        </div>
    </div>

    <script>
        function escribir(texto, clase = '') {
            const term = document.getElementById('terminal');
            term.innerHTML += `<br><span class="${clase}">> ${texto}</span>`;
            term.scrollTop = term.scrollHeight;
        }

        async function ejecutar(ruta) {
            escribir("Iniciando operación en AWS...", "info");
            try {
                const response = await fetch(ruta);
                const data = await response.json();
                if (response.ok) {
                    escribir(data.mensaje, "success");
                } else {
                    escribir(data.mensaje, "error");
                }
            } catch (error) {
                escribir("Error de conexión con el servidor", "error");
            }
        }
    </script>
</body>
</html>
